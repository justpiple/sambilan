services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      # Laravel Core
      - APP_NAME=${APP_NAME:-Sambilan}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY:?APP_KEY is required}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-${SERVICE_FQDN_APP:-http://localhost}}

      # Logging
      - LOG_CHANNEL=stderr
      - LOG_LEVEL=${LOG_LEVEL:-info}

      # Database Configuration
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-sambilan}
      - DB_USERNAME=${DB_USERNAME:-sambilan}
      - DB_PASSWORD=${SERVICE_PASSWORD_DB:-sambilan_secret}

      # State & Drivers
      - SESSION_DRIVER=${SESSION_DRIVER:-database}
      - CACHE_STORE=${CACHE_STORE:-database}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}

      # ServerSideUp Laravel Automations
      - AUTORUN_ENABLED=true
      - AUTORUN_LARAVEL_MIGRATION=true
      - AUTORUN_LARAVEL_MIGRATION_SEED=true
      - AUTORUN_LARAVEL_STORAGE_LINK=true
      - AUTORUN_LARAVEL_OPTIMIZE=true
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sambilan}
      MYSQL_USER: ${DB_USERNAME:-sambilan}
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_DB:-sambilan_secret}
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_ROOT:-root_sambilan_secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  app_storage:
  db_data:
